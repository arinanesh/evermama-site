<!doctype html>
<!--
  POST TEMPLATE. Copy to blog/<slug>.html, fill every {{SLOT}}, then add a
  .post-card for it at the top of the list in blog/index.html, and add its
  URL to /sitemap.xml.
  Slots: TITLE, SLUG (the filename without .html; goes in the canonical
  URL), DESCRIPTION (one sentence, for search/social), DATE
  (e.g. 21 August 2026), DATETIME (e.g. 2026-08-21), IMAGE (the hero
  illustration's basename under assets/illustrations/, with a .webp
  sibling generated next to the .png; see CLAUDE.md), IMAGE_ALT, DEK
  (one-line subtitle), RELATED_SLUG_1/2 + RELATED_TITLE_1/2 (two other
  posts), BODY (plain <p> paragraphs; <h2> for sections; <blockquote>
  for a pull quote). Keep DESCRIPTION free of double quotes; it also
  lands inside the JSON-LD block. When you revise a published post, bump
  dateModified in its JSON-LD and lastmod in /sitemap.xml.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}} - EverMama</title>
    <link rel="canonical" href="https://evermama.app/blog/{{SLUG}}" />
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="icon" href="/assets/favicon.png" type="image/png" />
    <meta name="theme-color" content="#fdfcfa" />
    <meta property="og:site_name" content="EverMama" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="https://evermama.app/blog/{{SLUG}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:image" content="https://evermama.app/assets/illustrations/{{IMAGE}}.png" />
    <meta property="og:image:width" content="1000" />
    <meta property="og:image:height" content="667" />
    <meta property="article:published_time" content="{{DATETIME}}" />
    <meta property="article:author" content="https://evermama.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <meta name="twitter:image" content="https://evermama.app/assets/illustrations/{{IMAGE}}.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "BlogPosting",
      "@id": "https://evermama.app/blog/{{SLUG}}#post",
      "mainEntityOfPage": "https://evermama.app/blog/{{SLUG}}",
      "headline": "{{TITLE}}",
      "description": "{{DESCRIPTION}}",
      "image": {
        "@type": "ImageObject",
        "url": "https://evermama.app/assets/illustrations/{{IMAGE}}.png",
        "width": 1000,
        "height": 667
      },
      "datePublished": "{{DATETIME}}",
      "dateModified": "{{DATETIME}}",
      "inLanguage": "en",
      "author": { "@type": "Organization", "name": "EverMama", "url": "https://evermama.app/" },
      "publisher": {
        "@type": "Organization",
        "name": "EverMama",
        "url": "https://evermama.app/",
        "logo": { "@type": "ImageObject", "url": "https://evermama.app/assets/icon.png", "width": 1024, "height": 1024 }
      },
      "isPartOf": { "@type": "Blog", "@id": "https://evermama.app/blog/#blog", "name": "EverMama blog" }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site">
      <div class="wrap">
        <a href="/" class="wordmark">
          <img src="/assets/mark.png" alt="" class="wordmark-icon" />
          EverMama
        </a>
        <nav>
          <a href="/blog/">Blog</a>
          <a href="/privacy">Privacy</a>
          <a href="/support">Support</a>
          <a href="/#get" class="nav-cta">Get the app</a>
        </nav>
      </div>
    </header>

    <main class="wrap wrap--doc doc">
      <article class="post">
        <span class="kicker"><time datetime="{{DATETIME}}">{{DATE}}</time></span>
        <h1>{{TITLE}}</h1>
        <figure class="post-hero">
          <picture>
            <source srcset="/assets/illustrations/{{IMAGE}}.webp" type="image/webp" />
            <img src="/assets/illustrations/{{IMAGE}}.png" alt="{{IMAGE_ALT}}" width="1000" height="667" fetchpriority="high" />
          </picture>
        </figure>
        <p class="dek">{{DEK}}</p>

        <div class="post-body">
          {{BODY}}
        </div>

        <div class="post-foot">
          <p>More from the blog: <a href="/blog/{{RELATED_SLUG_1}}">{{RELATED_TITLE_1}}</a> <span class="sep">·</span> <a href="/blog/{{RELATED_SLUG_2}}">{{RELATED_TITLE_2}}</a></p>
          <p><a href="/blog/">← All posts</a></p>
        </div>
      </article>
    </main>

    <footer class="site">
      <div class="wrap">
        <div>© 2026 EverMama</div>
        <nav>
          <a href="/blog/">Blog</a>
          <a href="/privacy">Privacy</a>
          <a href="/support">Support</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
